<!DOCTYPE html>
<html lang="es" data-theme="light" data-scale="normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitecrack — Inspector de Seguridad Web</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Banner Superior en Estilo Visual Glassmorphism -->
    <header class="navbar" role="banner">
      <div class="brand-group">
        <div class="brand-logo" aria-hidden="true">SC</div>
        <div>
          <h1 class="brand-name">Sitecrack</h1>
          <p class="brand-tagline">Inspector visual de peticiones y seguridad web</p>
        </div>
      </div>

      <div class="stats-pills" aria-label="Resumen de tráfico">
        <span class="stat-pill pill-total">📊 Total <strong id="stat-total">0</strong></span>
        <span class="stat-pill pill-https">🔒 Seguras (HTTPS) <strong id="stat-https">0</strong></span>
        <span class="stat-pill pill-alerts">🚨 Con avisos <strong id="stat-low-sec">0</strong></span>
        <span class="stat-pill pill-speed">⚡ Media <strong id="stat-latency">0 ms</strong></span>
      </div>

      <div class="nav-actions">
        <button id="btn-open-simulator" class="btn btn-primary" type="button">
          ＋ Nueva prueba
        </button>
        <button id="btn-export-report" class="btn" type="button" title="Abrir informe ejecutivo listo para imprimir o guardar en PDF">
          📄 Exportar Informe
        </button>
        <button id="btn-seed-demo" class="btn" type="button">
          Cargar ejemplos
        </button>
        <button id="btn-toggle-scale" class="btn btn-ghost" type="button" title="Cambiar tamaño de letra">
          A+
        </button>
        <button id="btn-toggle-theme" class="btn btn-ghost" type="button" title="Alternar modo claro / oscuro">
          ☾ Tema
        </button>
        <button id="btn-clear" class="btn btn-ghost" type="button" title="Vaciar lista">
          Vaciar
        </button>
      </div>
    </header>

    <!-- Espacio Principal en 2 Columnas Glass -->
    <main class="main-grid">
      <!-- Columna Izquierda: Lista de Peticiones Coloreada -->
      <section class="panel" aria-label="Lista de peticiones">
        <div class="search-bar">
          <input
            id="input-host-filter"
            class="search-input"
            type="search"
            placeholder="Buscar web o ruta..."
            aria-label="Buscar web o ruta"
          />
          <select id="select-grade-filter" class="method-select" aria-label="Filtrar por seguridad">
            <option value="">Todas</option>
            <option value="risk">🚨 Con avisos</option>
            <option value="safe">✔ Seguras</option>
          </select>
          <select id="select-method-filter" class="method-select" aria-label="Método">
            <option value="">Método</option>
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
          </select>
        </div>

        <div id="flow-list" class="flow-list" role="list">
          <!-- Tarjetas de peticiones inyectadas por app.js -->
        </div>
      </section>

      <!-- Columna Derecha: Banner Hero Glass y Avisos a Todo Color -->
      <section class="panel" aria-label="Detalle de la petición">
        <div id="inspector-scroll" class="inspector-scroll">
          <!-- Contenido del inspector inyectado por app.js -->
        </div>
      </section>
    </main>
  </div>

  <!-- Ventana Modal Glass para Crear una Prueba -->
  <div id="simulator-modal" class="modal-backdrop" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div>
        <h2 id="modal-title" style="font-size:1.05rem; font-weight:800;">Probar una dirección web</h2>
        <p style="font-size:0.83rem; color:var(--text-muted); margin-top:0.2rem;">
          Simula una petición para ver qué avisos de seguridad genera.
        </p>
      </div>

      <div class="field">
        <label for="sim-url">Dirección (URL)</label>
        <input id="sim-url" class="search-input" type="text" value="https://mi-tienda.ejemplo.es/pagos" />
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
        <div class="field">
          <label for="sim-method">Tipo de petición</label>
          <select id="sim-method" class="method-select">
            <option value="GET">GET (Consultar)</option>
            <option value="POST">POST (Enviar datos)</option>
          </select>
        </div>
        <div class="field">
          <label for="sim-status">Respuesta del servidor</label>
          <select id="sim-status" class="method-select">
            <option value="200">200 (Correcta)</option>
            <option value="403">403 (Acceso denegado)</option>
            <option value="500">500 (Fallo del servidor)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="sim-preset">Nivel de seguridad simulado</label>
        <select id="sim-preset" class="method-select">
          <option value="hardened">✔ Protección alta (Recomendada)</option>
          <option value="partial">⚠ Protección media (Faltan escudos)</option>
          <option value="vulnerable">🚨 Sin protección (Peligrosa)</option>
        </select>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:0.5rem;">
        <button id="btn-close-modal" class="btn" type="button">Cancelar</button>
        <button id="btn-submit-sim" class="btn btn-primary" type="button">Analizar petición</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
