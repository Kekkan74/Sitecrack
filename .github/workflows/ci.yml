name: Sitecrack DevSecOps CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-security-audit:
    name: Pytest & OWASP Guardrails (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic rich pytest

      - name: Run automated test suite (SOLID, Anti-SSRF, Remediation & Live Audit)
        run: |
          python -m pytest tests/test_sitecrack.py -v
